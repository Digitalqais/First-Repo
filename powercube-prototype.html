<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerCube X Prototype</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
            gap: 0;
        }

        .left-section {
            background: linear-gradient(135deg, #1a1a1a 0%, #000 100%);
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 24px;
            left: 24px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            color: #fff;
            font-size: 18px;
        }

        .search-bar {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0 20px;
            color: #fff;
            outline: none;
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .product-showcase {
            text-align: left;
            margin-bottom: 40px;
        }

        .brand-title {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #fff;
        }

        .tagline {
            font-size: 24px;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 40px;
            color: #fff;
        }

        .tagline .line {
            display: block;
        }

        .product-image-main {
            width: 100%;
            max-width: 400px;
            height: 300px;
            background: radial-gradient(circle at center, #ff4500, #cc3300);
            border-radius: 20px;
            position: relative;
            margin: 40px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(255, 69, 0, 0.3);
        }

        .product-details {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            margin-top: 20px;
        }

        .product-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }

        .product-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 12px;
        }

        .right-section {
            background-color: #000;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr 1fr;
            gap: 16px;
        }

        .search-icon {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            color: #fff;
        }

        .product-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 69, 0, 0.2);
        }

        .product-card.large {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 30px;
            padding: 30px;
        }

        .product-card-image {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #ff4500, #cc3300);
            border-radius: 16px;
            flex-shrink: 0;
            position: relative;
            box-shadow: 0 10px 20px rgba(255, 69, 0, 0.3);
        }

        .product-card.large .product-card-image {
            width: 150px;
            height: 150px;
        }

        .product-card-content {
            flex: 1;
        }

        .product-card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }

        .product-card.large .product-card-title {
            font-size: 20px;
        }

        .product-card-subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 16px;
        }

        .product-card.large .product-card-subtitle {
            font-size: 14px;
        }

        .price {
            font-size: 18px;
            font-weight: 700;
            color: #ff4500;
            position: absolute;
            bottom: 20px;
            right: 20px;
        }

        .product-card.large .price {
            position: static;
            font-size: 24px;
            margin-top: 12px;
        }

        .mesh-pattern {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background-image: 
                radial-gradient(circle at 25% 25%, #fff2 2px, transparent 2px),
                radial-gradient(circle at 75% 25%, #fff2 2px, transparent 2px),
                radial-gradient(circle at 25% 75%, #fff2 2px, transparent 2px),
                radial-gradient(circle at 75% 75%, #fff2 2px, transparent 2px);
            background-size: 20px 20px;
            opacity: 0.3;
        }

        .logo-badge {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 20px;
            height: 20px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto;
            }
            
            .left-section {
                padding: 40px 20px;
            }
            
            .brand-title {
                font-size: 36px;
            }
            
            .tagline {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <button class="close-btn">×</button>
            <input type="text" class="search-bar" placeholder="Search">
            
            <div class="product-showcase">
                <h1 class="brand-title">PowerCube X</h1>
                <div class="tagline">
                    <span class="line">Compact.</span>
                    <span class="line">Powerful.</span>
                    <span class="line">Reliable.</span>
                </div>
                
                <div class="product-image-main">
                    <div class="mesh-pattern"></div>
                    <div class="logo-badge">⚡</div>
                </div>
                
                <div class="product-details">
                    <div class="product-name">PowerCube X</div>
                    <div class="product-subtitle">Solar Charging Solution</div>
                </div>
            </div>
        </div>
        
        <div class="right-section">
            <button class="search-icon">🔍</button>
            
            <div class="product-card large">
                <div class="product-card-image">
                    <div class="mesh-pattern"></div>
                    <div class="logo-badge">⚡</div>
                </div>
                <div class="product-card-content">
                    <h3 class="product-card-title">PowerCube X Coil</h3>
                    <p class="product-card-subtitle">Solar Charger</p>
                    <div class="price">$399</div>
                </div>
            </div>
            
            <div class="product-card">
                <div class="product-card-image">
                    <div class="mesh-pattern"></div>
                    <div class="logo-badge">⚡</div>
                </div>
                <div class="product-card-content">
                    <h3 class="product-card-title">PowerCube X Coil</h3>
                    <p class="product-card-subtitle">S399</p>
                </div>
                <div class="price">$399</div>
            </div>
            
            <div class="product-card">
                <div class="product-card-image">
                    <div class="mesh-pattern"></div>
                    <div class="logo-badge">⚡</div>
                </div>
                <div class="product-card-content">
                    <h3 class="product-card-title">PowerCube X Coil</h3>
                    <p class="product-card-subtitle">S399</p>
                </div>
                <div class="price">$399</div>
            </div>
        </div>
    </div>
</body>
</html>
